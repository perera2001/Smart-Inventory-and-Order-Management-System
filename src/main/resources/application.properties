spring.application.name=auth-service
server.port=4040

spring.main.allow-circular-references=true

spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_service_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:knnp2001}

spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:replace-this-with-a-long-development-secret-key-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}
